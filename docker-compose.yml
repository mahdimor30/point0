services:
  app:
    build: .
    env_file:
      - .env

    depends_on:
      - postgres

    ports:
      - "3000:3000"

  postgres:
    image: postgres:17

    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: